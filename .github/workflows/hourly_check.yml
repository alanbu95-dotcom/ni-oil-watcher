name: Hourly NI Heating Oil Check

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run price monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_oil.py

      - name: Save updated price state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update price state" && git push)
          
